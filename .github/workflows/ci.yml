name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

jobs:
  backend-build-test:
    name: Build and test backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore solution
        run: dotnet restore NareshLearn.sln

      - name: Build solution
        run: dotnet build NareshLearn.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test tests/NareshLearn.UnitTests/NareshLearn.UnitTests.csproj --configuration Release --no-build --verbosity normal
        
      #- name: Run unit and integration tests
       # run: dotnet test NareshLearn.sln --configuration Release --no-build --verbosity normal
        