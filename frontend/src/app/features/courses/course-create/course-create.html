<!--p>course-create works!</p-->
<div class="course-create-page">
  <div class="course-create-card">
    <h1>Create Course</h1>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-field">
        <label for="title">Title</label>
        <input
          id="title"
          type="text"
          formControlName="title"
          [attr.aria-describedby]="form.controls.title.touched && form.controls.title.invalid ? 'course-title-error' : null"
          [attr.aria-invalid]="form.controls.title.touched && form.controls.title.invalid"
        />
        @if (form.controls.title.touched && form.controls.title.invalid) {
          <small id="course-title-error">Title is required and must be 200 characters or less.</small>
        }
      </div>

      <div class="form-field">
        <label for="description">Description</label>
        <textarea id="description" rows="5" formControlName="description"></textarea>
      </div>

      @if (errorMessage) {
        <div class="error-message" role="alert" aria-live="assertive">
          {{ errorMessage }}
        </div>
      }

      <button type="submit" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Creating...' : 'Create Course' }}
      </button>
    </form>
  </div>
</div>
